<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-labelledby="hero-t hero-d">
  <title id="hero-t">Laptop menampilkan kode HTML</title>
  <desc id="hero-d">Ilustrasi laptop berisi kerangka kode HTML, jendela browser yang menampilkan hasilnya, dan tag HTML yang melayang.</desc>
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0E7FF"/>
      <stop offset="1" stop-color="#CFFAFE"/>
    </linearGradient>
    <linearGradient id="h-scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#131A33"/>
    </linearGradient>
    <linearGradient id="h-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="h-acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="h-sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#312E81" flood-opacity=".18"/>
    </filter>
  </defs>

  <circle cx="262" cy="214" r="172" fill="url(#h-bg)"/>
  <circle cx="262" cy="214" r="136" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4 10" opacity=".9"/>

  <!-- Laptop -->
  <g filter="url(#h-sh)">
    <rect x="106" y="112" width="308" height="200" rx="16" fill="#334155"/>
    <rect x="118" y="124" width="284" height="176" rx="8" fill="url(#h-scr)"/>
    <path d="M126 124h268a8 8 0 0 1 8 8v14H118v-14a8 8 0 0 1 8-8z" fill="#272463"/>
    <circle cx="132" cy="135" r="4" fill="#F43F5E"/>
    <circle cx="145" cy="135" r="4" fill="#FBBF24"/>
    <circle cx="158" cy="135" r="4" fill="#22C55E"/>
    <rect x="172" y="128" width="76" height="14" rx="5" fill="#131A33"/>
    <text x="182" y="139" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5" fill="#A5B4FC">index.html</text>

    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
      <g fill="#475569">
        <text x="128" y="166">1</text><text x="128" y="181">2</text><text x="128" y="196">3</text>
        <text x="128" y="211">4</text><text x="128" y="226">5</text><text x="128" y="241">6</text>
        <text x="128" y="256">7</text><text x="128" y="271">8</text><text x="128" y="286">9</text>
      </g>
      <text x="146" y="166" fill="#C4B5FD">&lt;!DOCTYPE html&gt;</text>
      <text x="146" y="181"><tspan fill="#A5B4FC">&lt;</tspan><tspan fill="#67E8F9">html</tspan><tspan fill="#FBBF24"> lang</tspan><tspan fill="#A5B4FC">=</tspan><tspan fill="#86EFAC">"id"</tspan><tspan fill="#A5B4FC">&gt;</tspan></text>
      <text x="160" y="196"><tspan fill="#A5B4FC">&lt;</tspan><tspan fill="#67E8F9">head</tspan><tspan fill="#A5B4FC">&gt;</tspan></text>
      <text x="174" y="211"><tspan fill="#A5B4FC">&lt;</tspan><tspan fill="#67E8F9">title</tspan><tspan fill="#A5B4FC">&gt;</tspan><tspan fill="#F8FAFC">Profil</tspan><tspan fill="#A5B4FC">&lt;/</tspan><tspan fill="#67E8F9">title</tspan><tspan fill="#A5B4FC">&gt;</tspan></text>
      <text x="160" y="226"><tspan fill="#A5B4FC">&lt;/</tspan><tspan fill="#67E8F9">head</tspan><tspan fill="#A5B4FC">&gt;</tspan></text>
      <text x="160" y="241"><tspan fill="#A5B4FC">&lt;</tspan><tspan fill="#67E8F9">body</tspan><tspan fill="#A5B4FC">&gt;</tspan></text>
      <text x="174" y="256"><tspan fill="#A5B4FC">&lt;</tspan><tspan fill="#67E8F9">h1</tspan><tspan fill="#A5B4FC">&gt;</tspan><tspan fill="#F8FAFC">Halo!</tspan><tspan fill="#A5B4FC">&lt;/</tspan><tspan fill="#67E8F9">h1</tspan><tspan fill="#A5B4FC">&gt;</tspan></text>
      <text x="160" y="271"><tspan fill="#A5B4FC">&lt;/</tspan><tspan fill="#67E8F9">body</tspan><tspan fill="#A5B4FC">&gt;</tspan></text>
      <text x="146" y="286"><tspan fill="#A5B4FC">&lt;/</tspan><tspan fill="#67E8F9">html</tspan><tspan fill="#A5B4FC">&gt;</tspan></text>
    </g>
    <rect x="290" y="247" width="7" height="12" rx="1.5" fill="#06B6D4">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="152" y="198" width="3" height="76" rx="1.5" fill="#4F46E5" opacity=".5"/>

    <path d="M70 312h380l-20 24a10 10 0 0 1-7.7 3.6H97.7A10 10 0 0 1 90 336z" fill="url(#h-base)"/>
    <rect x="222" y="312" width="76" height="8" rx="4" fill="#64748B"/>
  </g>

  <!-- Jendela browser -->
  <g transform="translate(332 36)" filter="url(#h-sh)">
    <rect width="166" height="122" rx="14" fill="#fff"/>
    <path d="M14 0h138a14 14 0 0 1 14 14v12H0V14A14 14 0 0 1 14 0z" fill="#EEF2FF"/>
    <circle cx="14" cy="13" r="3.5" fill="#F43F5E"/>
    <circle cx="25" cy="13" r="3.5" fill="#FBBF24"/>
    <circle cx="36" cy="13" r="3.5" fill="#22C55E"/>
    <rect x="48" y="7" width="106" height="12" rx="6" fill="#fff"/>
    <rect x="16" y="40" width="96" height="11" rx="5.5" fill="url(#h-acc)"/>
    <rect x="16" y="60" width="134" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="16" y="72" width="118" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="16" y="84" width="126" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="16" y="98" width="52" height="14" rx="7" fill="#06B6D4"/>
  </g>
  <path d="M410 168 q-10 26 -40 40" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-dasharray="4 6" stroke-linecap="round"/>

  <!-- Tag melayang -->
  <g transform="translate(36 70)" filter="url(#h-sh)">
    <rect width="78" height="40" rx="14" fill="#fff" stroke="#C7D2FE" stroke-width="2"/>
    <text x="39" y="27" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#4F46E5">&lt;/&gt;</text>
  </g>
  <g transform="translate(30 262)" filter="url(#h-sh)">
    <rect width="72" height="34" rx="12" fill="#CFFAFE"/>
    <text x="36" y="23" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0E7490">&lt;h1&gt;</text>
  </g>
  <g transform="translate(436 252)" filter="url(#h-sh)">
    <rect width="62" height="34" rx="12" fill="#EDE9FE"/>
    <text x="31" y="23" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#6D28D9">&lt;p&gt;</text>
  </g>

  <!-- Bintang -->
  <path d="M128 52l4.5 9 10 1.5-7.2 7 1.7 9.9-9-4.7-9 4.7 1.7-9.9-7.2-7 10-1.5z" fill="#FBBF24"/>
  <path d="M470 196l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="#FBBF24"/>
  <circle cx="300" cy="44" r="5" fill="#06B6D4"/>
  <circle cx="86" cy="196" r="4" fill="#8B5CF6"/>
</svg>
